version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models:ro
      - ./faiss_index:/app/faiss_index:ro

  app:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./models:/app/models:ro
      - ./faiss_index:/app/faiss_index:ro
      - ./app:/app/app:ro
    depends_on:
      - api
